<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#0b0f14"},
    {"id":"color-panel","type":"color","label":"Panel","default":"#18202b"},
    {"id":"color-ink","type":"color","label":"Text","default":"#ffffff"},
    {"id":"color-muted","type":"color","label":"Muted text","default":"#9aa4b2"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#4ade80"},
    {"id":"font-display","type":"string","label":"Display font","default":"Archivo Black"},
    {"id":"font-mono","type":"string","label":"Mono font","default":"Space Mono"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Example project: "3 free tools" listicle, timed to assets/narration.wav.
         Scene slots and SFX times come from assets/transcript.json; see README.md. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-ground: #0b0f14;
        --color-panel: #18202b;
        --color-ink: #ffffff;
        --color-muted: #9aa4b2;
        --color-accent: #4ade80;
        --font-display: "Archivo Black";
        --font-mono: "Space Mono";
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root { position: relative; width: 1080px; height: 1920px; background: var(--color-ground); }
      #ground {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 30%, rgba(74, 222, 128, 0.16), rgba(11, 15, 20, 0) 60%),
          var(--color-ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="27"
      data-width="1080"
      data-height="1920"
    >
      <div id="ground" data-layout-ignore></div>

      <!-- Scenes: one idea each. Slots end on the cut word's start. -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="3.4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="tool1" data-composition-id="tool1" data-composition-src="compositions/tool1.html"
        data-start="3.4" data-duration="5.72" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="tool2" data-composition-id="tool2" data-composition-src="compositions/tool2.html"
        data-start="9.12" data-duration="6.2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="tool3" data-composition-id="tool3" data-composition-src="compositions/tool3.html"
        data-start="15.32" data-duration="5.78" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="21.1" data-duration="5.9" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <!-- Captions: script words, transcript timings (scripts/captions.py). -->
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="27" data-track-index="2" data-track-kind="captions"
        data-width="1080" data-height="1920"></div>

      <!-- Narration: local synthetic voice (disclosed on the end card). -->
      <audio id="narration" class="clip" data-start="0" data-duration="24.8" data-track-index="3" data-volume="1"
        src="assets/narration.wav"></audio>

      <!-- SFX: uisfx CC0 cues. start = picture time + 1 frame - the file's peak
           (npx hyperframes audio assets/sfx/<file> --json). Three swipe takes rotate. -->
      <audio id="sfx-snap-1" class="clip" data-start="1.307" data-duration="0.195" data-track-index="4" data-volume="0.5"
        src="assets/sfx/snap-studio.mp3"></audio>
      <audio id="sfx-cut-1" class="clip" data-start="3.391" data-duration="0.686" data-track-index="4" data-volume="0.5"
        src="assets/sfx/swipe-cinematic.mp3"></audio>
      <audio id="sfx-snap-2" class="clip" data-start="7.647" data-duration="0.195" data-track-index="4" data-volume="0.5"
        src="assets/sfx/snap-studio.mp3"></audio>
      <audio id="sfx-cut-2" class="clip" data-start="9.133" data-duration="0.334" data-track-index="4" data-volume="0.5"
        src="assets/sfx/swipe-studio.mp3"></audio>
      <audio id="sfx-cut-3" class="clip" data-start="15.316" data-duration="0.498" data-track-index="4" data-volume="0.5"
        src="assets/sfx/swipe-soft.mp3"></audio>
      <audio id="sfx-pop-1" class="clip" data-start="17.398" data-duration="0.608" data-track-index="4" data-volume="0.5"
        src="assets/sfx/badge-studio.mp3"></audio>
      <audio id="sfx-cut-4" class="clip" data-start="21.091" data-duration="0.686" data-track-index="4" data-volume="0.5"
        src="assets/sfx/swipe-cinematic.mp3"></audio>
      <audio id="sfx-payoff" class="clip" data-start="23.057" data-duration="1.224" data-track-index="4" data-volume="0.45"
        src="assets/sfx/complete-cinematic.mp3"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>

# Vertical Short: 1080x1920 at 30 fps, passed to manim with --config_file.
#
# frame 9 x 16 units, so 1 unit = 120 px and the origin is the frame centre
# (540, 960 px). The claw-shorts safe area (every word inside y 288-1248 px,
# x 120-888 px above y 840 and x 120-780 px below it) is, in units:
#   y from -2.4 to 5.6; x from -3.5 to 2.9 above y = 1.0, -3.5 to 2.0 below it.
# claw_manim.ShortScene checks every text object against it after each play.
[CLI]
pixel_width = 1080
pixel_height = 1920
frame_rate = 30
frame_height = 16.0
frame_width = 9.0
# claw-shorts default style: bg #0b0f14
background_color = #0b0f14
# Re-render every animation: no stale partial movies after a code edit.
disable_caching = True
progress_bar = none
verbosity = WARNING

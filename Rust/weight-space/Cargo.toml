[package]
name = "claw-weight-space"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Auditable copy-only BF16 weight edits and local paired inference experiments"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
tempfile = "3"

[[bin]]
name = "claw-wsp"
path = "src/main.rs"

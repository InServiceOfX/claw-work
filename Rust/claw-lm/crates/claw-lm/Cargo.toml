[package]
name = "claw-lm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = []
cuda = []

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
memmap2 = "0.9"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
minijinja = { version = "2", features = ["json", "loop_controls", "builtins", "preserve_order", "loader"] }

[dev-dependencies]
tempfile = "3"
clap.workspace = true

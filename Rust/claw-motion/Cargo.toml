[package]
name = "claw-motion"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Deterministic 2D physics and shape-morph motion graphics for vertical Shorts, rendered headless to MP4 (ideas from Matter.js and Flubber, written from scratch)"
repository = "https://github.com/InServiceOfX/claw-work"

[dependencies]
# Shared -14 LUFS loudness normalization (same implementation as the other renderers).
claw-shorts = { path = "../claw-shorts" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11.4"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

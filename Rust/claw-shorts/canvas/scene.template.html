<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>claw-shorts canvas scene</title>
<style>html,body{margin:0;background:#0b0f14}canvas{display:block}</style>
<canvas id="scene" width="1080" height="1920"></canvas>
<script>
// Generated by `claw-shorts canvas`. Everything is drawn from window.renderFrame(t),
// a pure function of t and the embedded data: no clocks, no randomness, no network.
const SHORT = /*__SHORT_DATA__*/null;
const canvas = document.querySelector('#scene');
const ctx = canvas.getContext('2d');

const SANS = 'Arial, Helvetica, sans-serif';
const MONO = '"Courier New", Menlo, monospace';
const clamp01 = x => Math.max(0, Math.min(1, x));
const smooth = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
const easeOut = x => 1 - Math.pow(1 - clamp01(x), 3);
const FOOTER_TOP_FROM_BOTTOM = 420;

if (!SHORT) {
  ctx.fillStyle = '#0b0f14'; ctx.fillRect(0, 0, 1080, 1920);
  ctx.fillStyle = '#fff'; ctx.font = `bold 48px ${SANS}`; ctx.textAlign = 'center';
  ctx.fillText('template: no data embedded', 540, 960);
  window.renderFrame = () => {};
} else {
  canvas.width = SHORT.width; canvas.height = SHORT.height;
  const W = SHORT.width, H = SHORT.height, C = SHORT.colors;
  const SAFE = 90, CONTENT_W = W - 2 * SAFE;
  const CAM = { x: W / 2, y: 800 };

  // ---------- helpers ----------
  const withAlpha = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
  };
  const roundRect = (x, y, w, h, r) => {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  };
  const setFont = (px, family = SANS) => { ctx.font = `bold ${px}px ${family}`; };
  const textW = (s, px, family = SANS) => { setFont(px, family); return ctx.measureText(s).width; };
  const fit = (s, maxW, start, min, family = SANS) => {
    let px = start; while (px > min && textW(s, px, family) > maxW) px -= 2; return px;
  };
  const wrap = (s, maxW, px, family = SANS) => {
    setFont(px, family);
    const lines = []; let cur = '';
    for (const word of s.split(/\s+/).filter(Boolean)) {
      const test = cur ? cur + ' ' + word : word;
      if (cur && ctx.measureText(test).width > maxW) { lines.push(cur); cur = word; } else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  };
  const peakAt = t => {
    const p = SHORT.peaks; if (!p.length) return 0;
    return p[Math.min(p.length - 1, Math.max(0, Math.floor(t * SHORT.fps)))];
  };
  // Text that slams in: scales down from 1.28 to 1 with a fade over 0.22 s.
  const slam = (draw, lt, start) => {
    const p = clamp01((lt - start) / 0.22);
    if (p <= 0) return;
    ctx.save(); ctx.globalAlpha = Math.min(1, p * 3);
    draw(1 + 0.28 * (1 - easeOut(p)));
    ctx.restore();
  };
  const centerText = (s, x, y, px, color, scale = 1, family = SANS) => {
    ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
    setFont(px, family); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = color; ctx.fillText(s, 0, 0); ctx.restore();
  };

  // Scrolling loudness bars: the last ~1.9 s of the narration, newest on the right.
  const drawWave = (cx, cy, width, maxH, t, color) => {
    const N = 56, f = Math.floor(t * SHORT.fps), step = width / N, bw = step * 0.62;
    ctx.save(); ctx.shadowColor = withAlpha(color, 0.55); ctx.shadowBlur = 16;
    for (let k = 0; k < N; k++) {
      const idx = f - (N - 1 - k);
      const v = idx >= 0 && idx < SHORT.peaks.length ? SHORT.peaks[idx] : 0;
      const h = 12 + maxH * Math.pow(v, 0.75);
      ctx.fillStyle = withAlpha(color, 0.25 + 0.75 * (k / (N - 1)));
      roundRect(cx - width / 2 + k * step, cy - h / 2, bw, h, bw / 2); ctx.fill();
    }
    ctx.restore();
  };

  // ---------- scenes ----------
  const drawTitle = (s, lt, d, first) => {
    const n = s.lines.length;
    let px = first ? 150 : 120;
    for (const l of s.lines) px = Math.min(px, fit(l, CONTENT_W, px, 56));
    const lh = px * 1.16, y0 = 640 - (n - 1) * lh / 2;
    s.lines.forEach((line, k) => {
      const color = n >= 2 && k === n - 1 ? C.accent : C.fg;
      slam(sc => centerText(line, W / 2, y0 + k * lh, px, color, sc), lt, 0.05 + k * 0.18);
    });
    drawWave(W / 2, 1010, CONTENT_W, 170, s.start_ms / 1000 + lt, C.accent);
  };

  const drawClone = (s, lt, d) => {
    const t = s.start_ms / 1000 + lt;
    const [inLabel, outLabel] = s.lines;
    const a = k => clamp01((lt - k) / 0.3);
    ctx.save(); ctx.globalAlpha = a(0.05);
    centerText(inLabel, W / 2, 430, fit(inLabel, CONTENT_W, 56, 34), C.fg); ctx.restore();
    // reference waveform with a playhead that sweeps while the "model" listens
    const refN = SHORT.ref_peaks.length, head = clamp01(lt / (0.45 * d));
    const step = CONTENT_W / Math.max(1, refN), bw = step * 0.66;
    ctx.save(); ctx.globalAlpha = a(0.2);
    for (let i = 0; i < refN; i++) {
      const h = 10 + 120 * Math.pow(SHORT.ref_peaks[i], 0.8), x = SAFE + i * step;
      ctx.fillStyle = i / refN <= head ? C.accent : withAlpha(C.muted, 0.55);
      roundRect(x, 590 - h / 2, bw, h, bw / 2); ctx.fill();
    }
    ctx.restore();
    // model chip, pulsing with the generated voice
    const pulse = peakAt(t);
    ctx.save(); ctx.globalAlpha = a(0.45);
    ctx.shadowColor = withAlpha(C.accent, 0.4 + 0.5 * pulse); ctx.shadowBlur = 30 + 30 * pulse;
    ctx.fillStyle = C.panel; roundRect(W / 2 - 250, 745, 500, 112, 28); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = withAlpha(C.accent, 0.8); ctx.lineWidth = 3; roundRect(W / 2 - 250, 745, 500, 112, 28); ctx.stroke();
    centerText('VoxCPM2', W / 2, 801, 58, C.fg);
    // dots flowing reference -> model -> output
    for (let seg = 0; seg < 2; seg++) {
      const y0 = seg === 0 ? 665 : 870, y1 = seg === 0 ? 735 : 950;
      for (let i = 0; i < 4; i++) {
        const p = ((t * 1.4 + i / 4) % 1);
        ctx.fillStyle = withAlpha(C.accent, 0.9 * Math.sin(p * Math.PI) * a(0.6));
        ctx.beginPath(); ctx.arc(W / 2, y0 + (y1 - y0) * p, 7, 0, 7); ctx.fill();
      }
    }
    ctx.save(); ctx.globalAlpha = a(0.8);
    drawWave(W / 2, 1040, CONTENT_W, 160, t, C.accent); ctx.restore();
    ctx.save(); ctx.globalAlpha = a(0.9);
    centerText(outLabel, W / 2, 1170, fit(outLabel, CONTENT_W, 62, 34), C.accent); ctx.restore();
  };

  const cursorChars = s => (s.command || '').length;
  const termMetrics = s => {
    setFont(40, MONO); const cw40 = ctx.measureText('M').width;
    const px = Math.min(40, Math.floor(40 * (CONTENT_W - 80) / ((cursorChars(s) + 2) * cw40)));
    setFont(px, MONO); const cw = ctx.measureText('M').width;
    return { px, cw, lh: Math.round(px * 1.62) };
  };
  const drawTerminal = (s, lt, d) => {
    const m = termMetrics(s), cmd = s.command || '';
    const lines = [];
    for (const o of s.output) lines.push(...wrap(o, CONTENT_W - 80, m.px, MONO));
    const top = 430, h = 110 + (1 + lines.length) * m.lh + 60, x0 = SAFE + 40;
    ctx.fillStyle = C.panel; roundRect(SAFE - 30, top, CONTENT_W + 60, h, 30); ctx.fill();
    [C.fail, C.warn, C.pass].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(SAFE + 20 + i * 46, top + 48, 13, 0, 7); ctx.fill(); });
    const cy = top + 130;
    const typeStart = 0.3, typeDur = Math.min(Math.max(cmd.length * 0.04, 0.6), d * 0.4);
    const typed = Math.floor(clamp01((lt - typeStart) / typeDur) * cmd.length);
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; setFont(m.px, MONO);
    ctx.fillStyle = C.pass; ctx.fillText('$', x0, cy);
    ctx.fillStyle = C.fg; ctx.fillText(cmd.slice(0, typed), x0 + 2 * m.cw, cy);
    // block cursor at the end of the command: solid while typing, then blinking
    if (typed < cmd.length || Math.floor(lt * 2) % 2 === 0) {
      ctx.fillStyle = withAlpha(C.fg, 0.85);
      ctx.fillRect(x0 + (2 + typed) * m.cw, cy - m.px * 0.55, m.cw * 0.6, m.px * 1.1);
    }
    const outStart = typeStart + typeDur + 0.25;
    lines.forEach((line, j) => {
      const p = clamp01((lt - (outStart + j * 0.45)) / 0.2);
      if (p <= 0) return;
      const last = j === lines.length - 1;
      ctx.save(); ctx.globalAlpha = p;
      ctx.translate(0, 14 * (1 - easeOut(p)));
      if (last) { const sc = 1 + 0.1 * (1 - easeOut(p)); ctx.translate(x0, cy + (1 + j) * m.lh); ctx.scale(sc, sc); ctx.translate(-x0, -(cy + (1 + j) * m.lh)); }
      ctx.fillStyle = last ? C.accent : C.fg; ctx.textAlign = 'left'; setFont(m.px, MONO);
      ctx.fillText(line, x0, cy + (1 + j) * m.lh);
      ctx.restore();
    });
  };
  const terminalZoom = (s, lt, d) => {
    const m = termMetrics(s), lines = s.output.length;
    const typeDur = Math.min(Math.max((s.command || '').length * 0.04, 0.6), d * 0.4);
    const p = smooth((lt - (0.3 + typeDur + 0.2)) / Math.max(0.5, d * 0.35));
    return { zoom: 1 + 0.1 * p, fx: W / 2, fy: 430 + 130 + (1 + lines) * m.lh * 0.6 };
  };

  const drawVerdict = (s, lt, d) => {
    slam(sc => centerText('VERDICT', W / 2, 440, 64, C.muted, sc), lt, 0.02);
    let y = 520;
    const px = 58, lh = px * 1.22, badgePx = 44;
    const span = d * 0.55;
    s.rows.forEach((row, k) => {
      const start = 0.35 + k * span / s.rows.length;
      const p = clamp01((lt - start) / 0.3);
      const lines = wrap(row.text, CONTENT_W, px);
      const bw = textW(row.mark, badgePx) + 56, bh = 78;
      const tone = C[row.tone] || C.fg;
      ctx.save(); ctx.globalAlpha = p; ctx.translate(-70 * (1 - easeOut(p)), 0);
      ctx.fillStyle = tone; roundRect(SAFE, y, bw, bh, 18); ctx.fill();
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; setFont(badgePx);
      ctx.fillStyle = C.bg; ctx.fillText(row.mark, SAFE + 28, y + bh / 2 + 2);
      setFont(px); ctx.fillStyle = C.fg;
      lines.forEach((l, i) => ctx.fillText(l, SAFE, y + bh + 22 + lh / 2 + i * lh));
      ctx.restore();
      y += bh + 22 + lines.length * lh + 46;
    });
  };

  const drawEndcard = (s, lt, d) => {
    const lpx = Math.min(130, ...s.lines.map(l => fit(l, CONTENT_W, 130, 56)));
    s.lines.forEach((line, k) => slam(sc => centerText(line, W / 2, 420 + k * lpx * 1.15, lpx, C.fg, sc), lt, 0.02 + k * 0.15));
    // scoreboard, big: the replay starts on the result
    const parts = SHORT.scoreboard;
    const rowsN = Math.ceil(parts.length / 2);
    const cw = (CONTENT_W - 30) / 2, ch = 100;
    parts.forEach((part, i) => {
      const col = i % 2, row = Math.floor(i / 2);
      const rowCount = Math.min(2, parts.length - row * 2);
      const x = rowCount === 1 ? W / 2 - cw / 2 : SAFE + col * (cw + 30);
      const y = 540 + row * (ch + 20);
      const p = clamp01((lt - (0.35 + i * 0.22)) / 0.25);
      if (p <= 0) return;
      ctx.save(); ctx.globalAlpha = p; ctx.translate(x + cw / 2, y + ch / 2); const sc = 1 + 0.12 * (1 - easeOut(p)); ctx.scale(sc, sc);
      ctx.fillStyle = C.panel; roundRect(-cw / 2, -ch / 2, cw, ch, 24); ctx.fill();
      ctx.strokeStyle = withAlpha(C.accent, 0.7); ctx.lineWidth = 3; roundRect(-cw / 2, -ch / 2, cw, ch, 24); ctx.stroke();
      centerText(part, 0, 3, fit(part, cw - 40, 54, 30), C.fg);
      ctx.restore();
    });
    const urlY = 540 + rowsN * (ch + 20) + 55;
    if (s.url) {
      const segs = s.url.split(/(?<=\/)/); let lines = [], cur = '';
      for (const seg of segs) { if (cur && textW(cur + seg, 44) > CONTENT_W) { lines.push(cur); cur = seg; } else cur += seg; }
      if (cur) lines.push(cur);
      const upx = Math.min(...lines.map(l => fit(l, CONTENT_W, 44, 28)));
      const p = clamp01((lt - 1.0) / 0.3);
      ctx.save(); ctx.globalAlpha = p;
      lines.forEach((l, i) => centerText(l, W / 2, urlY + i * upx * 1.3, upx, C.accent));
      ctx.restore();
      if (SHORT.engagement_prompt) {
        const ey = urlY + lines.length * upx * 1.3 + 30;
        const q = clamp01((lt - 1.5) / 0.3), plines = wrap(SHORT.engagement_prompt, CONTENT_W - 70, 46);
        const bh = 50 + plines.length * 58;
        ctx.save(); ctx.globalAlpha = q; ctx.translate(0, 24 * (1 - easeOut(q)));
        ctx.fillStyle = withAlpha(C.accent, 0.14); roundRect(SAFE, ey, CONTENT_W, bh, 26); ctx.fill();
        ctx.strokeStyle = C.accent; ctx.lineWidth = 3; roundRect(SAFE, ey, CONTENT_W, bh, 26); ctx.stroke();
        plines.forEach((l, i) => centerText(l, W / 2, ey + 25 + 29 + i * 58, 46, C.fg));
        ctx.restore();
      }
    }
  };

  // ---------- chrome (screen space) ----------
  const drawDots = (t) => {
    const n = SHORT.scenes.length, dw = 64, gap = 14, x0 = (W - (n * dw + (n - 1) * gap)) / 2;
    SHORT.scenes.forEach((s, i) => {
      const active = t >= s.start_ms / 1000 && t < s.end_ms / 1000;
      ctx.fillStyle = active ? C.accent : C.panel;
      roundRect(x0 + i * (dw + gap), 230, dw, 10, 5); ctx.fill();
    });
  };
  const drawScoreboardBand = (t, kind) => {
    const parts = SHORT.scoreboard; if (!parts.length || kind === 'endcard') return;
    const p = easeOut((t - 1.4) / 0.35); if (p <= 0) return;
    const px = 34, gap = 16, padX = 22;
    const widths = parts.map(s => textW(s, px) + 2 * padX);
    const total = widths.reduce((a, b) => a + b, 0) + gap * (parts.length - 1);
    const scale = Math.min(1, CONTENT_W / total);
    ctx.save(); ctx.globalAlpha = p; ctx.translate(W / 2, 300 - 30 * (1 - p)); ctx.scale(scale, scale);
    let x = -total / 2;
    parts.forEach((s, i) => {
      ctx.fillStyle = C.panel; roundRect(x, -28, widths[i], 56, 28); ctx.fill();
      ctx.fillStyle = C.accent; ctx.beginPath(); ctx.arc(x + 20, 0, 6, 0, 7); ctx.fill();
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; setFont(px); ctx.fillStyle = C.fg;
      ctx.fillText(s, x + padX + 10, 2); x += widths[i] + gap;
    });
    ctx.restore();
  };
  // Phrases of up to 4 words, split at sentence ends and long gaps.
  const phrases = (() => {
    const out = []; let cur = [];
    const flush = () => { if (cur.length) { out.push(cur); cur = []; } };
    SHORT.words.forEach((w, i) => {
      cur.push(w);
      const next = SHORT.words[i + 1];
      const gap = next ? next.start_ms - w.end_ms : 1e9;
      if (cur.length >= 4 || /[.?!]$/.test(w.text) || gap > 350 || cur.map(x => x.text).join(' ').length > 24) flush();
    });
    flush(); return out;
  })();
  const drawCaptions = (t) => {
    const ms = t * 1000;
    let idx = phrases.findIndex((ph, i) => {
      const start = ph[0].start_ms - 60;
      const nextStart = phrases[i + 1] ? phrases[i + 1][0].start_ms - 60 : 1e9;
      const end = Math.min(nextStart, ph[ph.length - 1].end_ms + 300);
      return ms >= start && ms < end;
    });
    if (idx < 0) return;
    const ph = phrases[idx], px = 66, maxW = CONTENT_W;
    setFont(px);
    const space = ctx.measureText(' ').width;
    const widths = ph.map(w => ctx.measureText(w.text).width);
    const total = widths.reduce((a, b) => a + b, 0) + space * (ph.length - 1);
    let rows = [ph.map((_, i) => i)];
    if (total > maxW) { const half = Math.ceil(ph.length / 2); rows = [ph.slice(0, half).map((_, i) => i), ph.slice(half).map((_, i) => i + half)]; }
    rows.forEach((row, r) => {
      const rowW = row.reduce((a, i) => a + widths[i], 0) + space * (row.length - 1);
      let x = W / 2 - rowW / 2; const y = 1330 + (r - (rows.length - 1) / 2) * 84;
      row.forEach(i => {
        const w = ph[i], active = ms >= w.start_ms && ms < w.end_ms;
        const pop = active ? 1 + 0.08 * (1 - easeOut((ms - w.start_ms) / 120)) : 1;
        ctx.save(); ctx.translate(x + widths[i] / 2, y); ctx.scale(pop, pop);
        setFont(px); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round'; ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(0,0,0,0.88)'; ctx.strokeText(w.text, 0, 0);
        ctx.fillStyle = active ? C.accent : C.fg; ctx.fillText(w.text, 0, 0); ctx.restore();
        x += widths[i] + space;
      });
    });
  };
  const drawFooter = () => {
    if (!SHORT.footer) return;
    const lines = wrap(SHORT.footer, CONTENT_W, 30); ctx.fillStyle = C.muted;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; setFont(30);
    lines.forEach((l, i) => ctx.fillText(l, W / 2, H - FOOTER_TOP_FROM_BOTTOM + 20 + i * 40));
  };

  // ---------- frame ----------
  window.renderFrame = function (t) {
    const scenes = SHORT.scenes;
    let i = scenes.findIndex(s => t * 1000 >= s.start_ms && t * 1000 < s.end_ms);
    if (i < 0) i = scenes.length - 1;
    const s = scenes[i], lt = Math.max(0, t - s.start_ms / 1000), d = (s.end_ms - s.start_ms) / 1000;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    // a soft glow that breathes with the narration
    const g = ctx.createRadialGradient(W / 2, 820, 80, W / 2, 820, 900);
    g.addColorStop(0, withAlpha(C.accent, 0.05 + 0.09 * peakAt(t))); g.addColorStop(1, withAlpha(C.accent, 0));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // camera: slow push-in, a scale punch on every cut, and a close-up on terminal output
    let zoom = 1 + 0.04 * smooth(lt / d) + 0.07 * (1 - easeOut(lt / 0.25)), fx = CAM.x, fy = CAM.y;
    if (s.kind === 'terminal') { const z = terminalZoom(s, lt, d); zoom *= z.zoom; fx = z.fx; fy = z.fy; }
    ctx.save();
    ctx.translate(fx, fy); ctx.scale(zoom, zoom); ctx.translate(-fx, -fy); // zoom about the focus point
    switch (s.kind) {
      case 'clone': drawClone(s, lt, d); break;
      case 'terminal': drawTerminal(s, lt, d); break;
      case 'verdict': drawVerdict(s, lt, d); break;
      case 'endcard': drawEndcard(s, lt, d); break;
      default: drawTitle(s, lt, d, i === 0);
    }
    ctx.restore();
    drawDots(t); drawScoreboardBand(t, s.kind); drawCaptions(t); drawFooter();
  };
  window.renderFrame(0);
}
</script>
</html>

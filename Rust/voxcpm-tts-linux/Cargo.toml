[package]
name = "voxcpm-tts-linux"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Ubuntu/Linux command-line voice-cloning text-to-speech around VoxCPM2 (candle + CUDA/CPU), loading weights from a local directory"

[lib]
name = "voxcpm_tts"
path = "src/lib.rs"

# Same binary name as the macOS crate so scripts that call `voxcpm-tts` work on both.
[[bin]]
name = "voxcpm-tts"
path = "src/main.rs"

[features]
# CUDA is the default on Linux; build with `--no-default-features` for CPU only.
default = ["cuda"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
anyhow = "1"
candle-core = "0.11.1"
candle-nn = "0.11.1"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
hound = "3.5"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["wav", "mp3", "pcm", "flac", "aac", "isomp4"] }
tempfile = "3"
thiserror = "2"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"

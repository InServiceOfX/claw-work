[package]
name = "claw-edit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Local reviewed cut-list rendering and caption retiming via FFmpeg"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

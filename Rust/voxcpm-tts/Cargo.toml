[package]
name = "voxcpm-tts"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "macOS (Apple Silicon) voice-cloning text-to-speech around VoxCPM2: chunking, synthesis, stitching, progress/ETA"

[lib]
name = "voxcpm_tts"
path = "src/lib.rs"

[[bin]]
name = "voxcpm-tts"
path = "src/main.rs"

[[bin]]
name = "voxcpm-tts-app"
path = "src/gui/main.rs"
required-features = ["gui"]

[features]
default = []
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
anyhow = "1"
candle-core = { version = "0.11.1", features = ["metal"] }
candle-nn = { version = "0.11.1", features = ["metal"] }
candle-metal-kernels = "0.11.1"
objc2 = "0.6.5"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
eframe = { version = "0.33", optional = true }
hf-hub = { version = "0.4", default-features = false, features = ["ureq", "rustls-tls"] }
hound = "3.5"
indicatif = "0.17"
rfd = { version = "0.15", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["wav", "mp3", "pcm", "flac", "aac", "isomp4"] }
tempfile = "3"
thiserror = "2"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
tempfile = "3"

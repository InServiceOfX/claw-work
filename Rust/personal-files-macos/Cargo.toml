[package]
name = "personal-files-macos"
version = "0.2.0"
edition = "2021"
description = "Native macOS file browser with remembered personal places"
license = "MIT"

[lib]
name = "personal_files"

[[bin]]
name = "personal-files-macos"
path = "src/main.rs"

[dependencies]
objc2 = "0.6.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
strip = true

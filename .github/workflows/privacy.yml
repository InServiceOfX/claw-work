name: Public boundary
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  source-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install tested compiler
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Test authored public fixtures
        working-directory: Rust/lean-agent
        run: |
          cargo +1.97.1 fmt --check
          cargo +1.97.1 test --locked --all-targets
          cargo +1.97.1 clippy --locked --all-targets -- -D warnings
      - name: Test no-overwrite local deployment and offline feedback policy
        working-directory: Rust/lean-agent
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Scan complete committed index and reviewed Docker context
        working-directory: Rust/lean-agent
        run: |
          cargo +1.97.1 run --locked --bin claw-public-check -- index ../..
          cargo +1.97.1 run --locked --bin claw-public-check -- context .
# No upload, deployment, provider credentials, shared private cache, or Docker
# publication. Heavy Docker acceptance/canary checks are explicitly local below.
